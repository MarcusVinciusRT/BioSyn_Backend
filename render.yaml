# Blueprint do Render. Em New > Blueprint, aponte para este repositorio e o
# Render cria o servico com esta configuracao.
#
# ATENCAO: os valores marcados com `sync: false` NAO ficam no repositorio --
# voce preenche no painel do Render, uma vez, no primeiro deploy. E por isso que
# senha de banco, senha do wallet e chave JWT nao aparecem aqui.

services:
  - type: web
    name: biosyn-backend
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health

    # Desligado de proposito. O deploy e disparado pelo GitHub Actions, depois
    # que os testes passam (.github/workflows/ci.yml). Com autoDeploy ligado, o
    # Render publicaria direto no push -- inclusive com a suite quebrada.
    autoDeploy: false

    buildCommand: pip install -r requirements.txt
    # $PORT e injetado pelo Render. --proxy-headers faz o IP real do cliente
    # chegar ate o limitador de tentativas de login; sem ele, todas as
    # tentativas contam como vindas do balanceador.
    startCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips '*'

    envVars:
      - key: PYTHON_VERSION
        # 3.14 nao tem wheel de pydantic-core e a compilacao falha no build.
        value: "3.13.15"

      - key: AMBIENTE
        # "homolog" mantem /docs aberto para o time de front consultar.
        # Troque para "prod" quando a API for publica de verdade.
        value: homolog
      - key: LOG_LEVEL
        value: INFO

      # --- Oracle ADB ---
      - key: DB_USER
        value: APP_BACKEND
      - key: DB_PASSWORD
        sync: false
      - key: DB_DSN
        value: dbdatasus_medium
      # O wallet e segredo, esta fora do git, e o Render nao tem disco
      # persistente para monta-lo. A saida e o .zip do wallet em base64 numa
      # variavel: a aplicacao materializa num diretorio temporario com permissao
      # restrita, que morre junto com o processo (ver app/db/wallet.py).
      # Gere com:  base64 -i wallet/wallet-dbdatasus.zip | tr -d '\n'
      # WALLET_DIR fica de fora de proposito: WALLET_BASE64 tem precedencia.
      - key: WALLET_BASE64
        sync: false
      - key: WALLET_PASSWORD
        sync: false
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "4"

      # --- JWT ---
      # Gere uma chave NOVA para producao, diferente da local:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRA_SEGUNDOS
        value: "1800"

      # --- Alertas por e-mail ---
      # O Render gratuito bloqueia as portas SMTP (25, 465, 587), entao aqui o
      # e-mail sai pela API HTTPS da Brevo. Local (e em plano pago) o canal smtp
      # continua funcionando -- a troca e so esta variavel.
      - key: ALERTA_CANAL
        value: brevo
      # Brevo > SMTP & API > API Keys.
      - key: BREVO_API_KEY
        sync: false
      # Precisa estar cadastrado em Brevo > Senders. Com Gmail, a Brevo troca o
      # dominio de envio por @brevosend.com e mantem o nome de exibicao.
      - key: BREVO_REMETENTE
        sync: false
      - key: BREVO_REMETENTE_NOME
        value: BioSyn

      # --- Relatorios e chat ---
      - key: LAKEHOUSE_MODO
        value: fallback
      - key: AI_PROFILE_NAME
        value: APP_PROFILE
      - key: AI_TIMEOUT_SEGUNDOS
        value: "45"

      # --- CORS ---
      # Vale so para navegador: Postman, curl e o /docs nao passam por aqui.
      # Enquanto o front roda local apontando para esta API, a origem que conta
      # e a maquina do dev -- por isso localhost ja resolve no comeco.
      # Quando o front publicar, acrescente a URL dele, separada por virgula.
      - key: CORS_ORIGENS
        value: http://localhost:5173,http://localhost:3000
      # Opcional: padrao para as URLs de preview (Vercel/Netlify criam uma nova
      # por PR). Preencha no painel quando souber o nome do projeto do front.
      # Ex: https://biosyn-front(-git-[a-z0-9-]+)?\.vercel\.app
      - key: CORS_ORIGENS_REGEX
        sync: false
